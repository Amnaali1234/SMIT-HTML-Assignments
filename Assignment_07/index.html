<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment_07</title>
  </head>
  <body>
    <h1>
      <i
        ><u>SMIT Paposh Campus Branch <sup>-18</sup></u></i
      >
    </h1>
    <form>
      <fieldset>
        <legend>
          <b
            ><i>Assignment # 7 <sup>(Forms)</sup></i></b
          >
        </legend>
        <fieldset>
          <legend><i>Personal Information</i></legend>
          <label for="your name">Full Name:</label> <br />
          <input
            type="text"
            placeholder="Enter your full name"
            id="your name"
          />
          <br />
          <br />
          <label for="pass">Password:</label> <br />
          <input
            type="password"
            placeholder="Enter a astrong password"
            id="pass"
          />
          <br />
          <br />
          <label for="email">Email:</label> <br>
          <input type="email" placeholder="your@email.com" id="email"> <br> <br>
          <label for="num">Phone Number:</label> <br />
          <input type="number" placeholder="+1234567890" id="num" /> <br />
          <br />
          <label>Date of Birth:</label> <br />
          <input type="date" /> <br />
          <br />
          <label for="time">Preferred Contact Time:</label> <br />
         <textarea rows="1" cols="9" id="time" placeholder="-- :-- --"></textarea>
          <br />
          <label>Gender:</label> <br />
          <input type="radio" name="gender" />Male
          <input type="radio" name="gender" />Female
          <input type="radio" name="gender" />Other <br />
          <br />
          <label for="file">Profile Picture:</label> <br />
          <input type="file" id="file" /> <br />
          <br />
          <fieldset>
            <legend><i>Education & Skills</i></legend>
            <label>Technical Skills:</label> <br />
            <input type="checkbox" name="Skills" />HTML
            <input type="checkbox" name="Skills" />CSS
            <input type="checkbox" name="Skills" />JavaScript
            <input type="checkbox" name="Skills" />Python
            <input type="checkbox" name="Skills" />SQL <br />
            <br />
            <label for="year">Years of Eperience:</label> <br />
            <input type="number" id="year" /> <br />
            <br />
            <fieldset>
              <legend><i>Preferences</i></legend>
              <label>Favourite Color:</label> <br />
              <input type="color" /> <br />
              <br />
              <label>Notification Volume:</label> <br />
              <input type="range" /> <br />
              <br />
              <label for="search">Serach Something:</label> <br />
              <input type="search" id="search" /> <br />
              <br />
              <label for="link">Your Website:</label> <br />
              <input type="url" placeholder="https://example.com" id="link" />
              <br />
              <br />
            </fieldset>
          </fieldset>
        </fieldset>
      </fieldset>
    </form>
  </body>
</html>
